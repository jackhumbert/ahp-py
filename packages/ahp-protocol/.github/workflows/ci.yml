name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Dev requirements are a PEP 735 group, not an extra: an extra is baked
      # into the wheel's Requires-Dist and PyPI rejects direct references there.
      - run: pip install -e . && pip install --group dev

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Type-check
        run: mypy

      - name: Import contracts
        run: lint-imports

      # The whole suite runs offline: no model, no credentials, no network.
      # It includes a real wheel build, which is the only way to catch a corpus
      # that resolves in a source checkout and is absent from the package.
      - name: Test
        run: pytest

  codegen-is-reproducible:
    # The generated tables are derived from the vendored upstream TypeScript.
    # A stale checked-in copy would silently diverge from the pin.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . && pip install --group dev
      - run: python scripts/generate_tables.py
      - name: Fail if _generated.py is stale
        run: git diff --exit-code -- src/agent_host_protocol/types/_generated.py

  wheel-is-installable:
    # `tests/unit/test_packaging.py` looks INSIDE the built wheel from a source
    # checkout. This installs it and runs it from a directory that is not the
    # repository, which is the only way to catch a path that resolves via the
    # source tree -- the exact defect that shipped a fixture loader with no
    # fixtures in the repo this code came from.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel --outdir dist
      - name: Install the wheel into a clean venv
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install "$(echo dist/*.whl)"
      - name: Smoke-test it from outside the checkout
        run: cd /tmp && /tmp/fresh/bin/python "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"

  consumers-still-build:
    # This package is a FLOOR, not a leaf: a host and a client both stand on it,
    # and its whole reason for existing is that they share one copy of the
    # reducers. A change here that breaks either of them has broken the point of
    # the extraction, and finding that out at their next release is too late.
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        consumer: [agent-host-server-py, agent-host-client-py]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jackhumbert/${{ matrix.consumer }}
          path: .consumer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # This package first, so the consumer's own pin resolves to the working
      # tree rather than to whatever is on PyPI.
      - run: pip install -e .
      # Both consumers declare dev requirements as an extra today. If one moves
      # to a PEP 735 group this needs to follow it -- deliberately not written
      # as a `||` fallback, which would hide the change rather than surface it.
      - run: pip install -e '.consumer[dev]'
      - run: pytest
        working-directory: .consumer
