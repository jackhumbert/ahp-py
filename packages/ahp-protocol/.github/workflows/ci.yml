name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Dev requirements are a PEP 735 group, not an extra: an extra is baked
      # into the wheel's Requires-Dist and PyPI rejects direct references there.
      - run: pip install -e . && pip install --group dev

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Type-check
        run: mypy

      - name: Import contracts
        run: lint-imports

      # The whole suite runs offline: no model, no credentials, no network.
      # It includes a real wheel build, which is the only way to catch a corpus
      # that resolves in a source checkout and is absent from the package.
      - name: Test
        run: pytest

  codegen-is-reproducible:
    # The generated tables are derived from the vendored upstream TypeScript.
    # A stale checked-in copy would silently diverge from the pin.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . && pip install --group dev
      - run: python scripts/generate_tables.py
      - name: Fail if _generated.py is stale
        run: git diff --exit-code -- src/agent_host_protocol/types/_generated.py

  sibling-drift:
    # Until agent-host-server-py is migrated onto this package (ADR 0002), it
    # carries its own copy of the extracted tree and the two can diverge. This
    # job reports the divergence rather than failing on it -- a fix landing in
    # either repo is legitimate; a fix landing in only one is the hazard.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: jackhumbert/agent-host-server-py
          path: .sibling
      - name: Report drift from the sibling's copy
        run: python scripts/check_sibling_drift.py --sibling .sibling
