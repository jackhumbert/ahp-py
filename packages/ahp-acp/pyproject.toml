[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ahp-acp"
dynamic = ["version"]
description = "A plain Agent Client Protocol (ACP) client: spawn an agent, speak JSON-RPC over stdio. Standard library only."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ahp-acp contributors" }]
keywords = ["acp", "agent-client-protocol", "agent", "json-rpc"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# Standard library only, on purpose: no ACP SDK and no AHP package.
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "mypy>=1.11",
  "ruff>=0.6",
  "import-linter>=2",
]

[tool.hatch.version]
path = "src/ahp_acp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ahp_acp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "TID", "RUF"]

[tool.importlinter]
root_package = "ahp_acp"
include_external_packages = true

# This package is the floor for ACP clients: it depends on nothing else here.
[[tool.importlinter.contracts]]
name = "ahp-acp imports no other ahp package"
type = "forbidden"
source_modules = ["ahp_acp"]
forbidden_modules = [
  "ahp_protocol",
  "ahp_host",
  "ahp_client",
  "ahp_gateway",
  "ahp_host_claude",
  "ahp_host_acp",
  "ahp_host_flow",
]
