[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ahp-host-acp"
dynamic = ["version"]
description = "Any Agent Client Protocol (ACP) agent as a provider for ahp-host."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ahp-host-acp contributors" }]
keywords = ["ahp", "agent-host-protocol", "acp", "agent-client-protocol", "agent"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# ACP is newline-delimited JSON-RPC over the agent's stdio, small enough to
# speak directly; no ACP SDK, so the only pin is the host's protocol version.
dependencies = [
  "ahp-host[ws]~=0.1.0",
]

[project.scripts]
ahp-host-acp = "ahp_host_acp.__main__:main"

[project.entry-points."ahp_host.agents"]
acp = "ahp_host_acp.agent:create"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "mypy>=1.11",
  "ruff>=0.6",
]

[tool.hatch.version]
path = "src/ahp_host_acp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ahp_host_acp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "TID", "RUF"]
