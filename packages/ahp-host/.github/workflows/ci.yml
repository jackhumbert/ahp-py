name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/checkout@v4
        with:
          repository: jackhumbert/agent-host-protocol-py
          path: .protocol
      # Until `agent-host-protocol` is on PyPI. The pin in
      # pyproject.toml is the real declaration; this only supplies it.
      - run: pip install -e .protocol
      - run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Type-check
        run: mypy

      - name: Import contracts
        run: lint-imports

      # The whole suite runs offline: no model, no credentials, no network.
      - name: Test
        run: pytest

  interop:
    # The real Microsoft TypeScript client against our host, over a socket. The
    # reference client validates almost nothing, so this is one of only two
    # checks that are genuinely independent of our own reading of the spec.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/checkout@v4
        with:
          repository: jackhumbert/agent-host-protocol-py
          path: .protocol
      - run: pip install -e .protocol
      - run: pip install -e '.[dev,ws]'
      # 0.6.0 is the newest published client; we negotiate 0.7.0 when offered.
      - run: npm i --no-save @microsoft/agent-host-protocol@0.6.0 ws
      - name: Interop
        # Without this the tests skip themselves when setup breaks, and a
        # skipped interop suite looks exactly like a passing one.
        env:
          AHP_INTEROP_REQUIRED: "1"
        run: pytest -m interop

  wheel-is-installable:
    # Three publication defects were invisible from a checkout and obvious from
    # an install: missing exports, a demo tree resolving outside the package,
    # and a missing py.typed. This is the check that would have caught all
    # three -- from a directory that is not the repository, against a venv that
    # has no source tree in it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: jackhumbert/agent-host-protocol-py
          path: .protocol
      - run: pip install build
      - run: python -m build --wheel --outdir dist
      - name: Install the wheel into a clean venv
        run: |
          python -m venv /tmp/fresh
          # The dependency first, from the sibling checkout, until it is on
          # PyPI. `--no-deps` on the wheel so pip does not then try to resolve
          # the same name from an index that does not have it yet.
          /tmp/fresh/bin/pip install ./.protocol
          /tmp/fresh/bin/pip install --no-deps "$(echo dist/*.whl)" websockets
      - name: Smoke-test it from outside the checkout
        run: cd /tmp && /tmp/fresh/bin/python "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"

  protocol-main:
    # Non-blocking. The dependency is pinned `~=0.1.0`, so this repository is
    # insulated from the protocol package's main branch -- which is exactly why
    # drift there would otherwise be invisible until a release. This makes it
    # visible the day it lands, without failing a PR for someone else's commit.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jackhumbert/agent-host-protocol-py
          ref: main
          path: .protocol
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .protocol
      - run: pip install -e '.[dev]'
      - run: pytest
