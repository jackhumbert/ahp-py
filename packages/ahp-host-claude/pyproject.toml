[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ahp-host-claude"
dynamic = ["version"]
description = "Claude (via the Claude Agent SDK) as a provider for ahp-host."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ahp-host-claude contributors" }]
keywords = ["ahp", "agent-host-protocol", "claude", "agent"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# `ahp-host` is the host this plugs into; its pin is a protocol-version
# statement, like the rest of the family. The Agent SDK moves fast and bundles
# its own Claude Code CLI, so it is pinned to the minor this was built against.
dependencies = [
  "ahp-host[ws]~=0.1.0",
  "claude-agent-sdk>=0.2.159,<0.3",
  # claude.ai's Remote Control endpoints, for sessions started elsewhere.
  "httpx>=0.27,<1",
]

[project.scripts]
ahp-host-claude = "ahp_host_claude.__main__:main"

[project.entry-points."ahp_host.agents"]
claude = "ahp_host_claude.agent:create"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "mypy>=1.11",
  "ruff>=0.6",
]

[tool.hatch.version]
path = "src/ahp_host_claude/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ahp_host_claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "TID", "RUF"]
