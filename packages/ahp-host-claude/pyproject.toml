[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-host-server-claude"
dynamic = ["version"]
description = "Claude (via the Claude Agent SDK) as a provider for agent-host-server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "agent-host-server-claude contributors" }]
keywords = ["ahp", "agent-host-protocol", "claude", "agent"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# `agent-host-server` is the host this plugs into; its pin is a protocol-version
# statement, like the rest of the family. The Agent SDK moves fast and bundles
# its own Claude Code CLI, so it is pinned to the minor this was built against.
dependencies = [
  "agent-host-server[ws]~=0.1.0",
  "claude-agent-sdk>=0.2.159,<0.3",
]

[project.scripts]
agent-host-server-claude = "agent_host_server_claude.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "mypy>=1.11",
  "ruff>=0.6",
]

[tool.hatch.version]
path = "src/agent_host_server_claude/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_host_server_claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "TID", "RUF"]
