name: Release

# Pushing a `v*` tag is the release action; everything after that is mechanical.
# The full CI suite is not re-run here -- a tag is cut from a commit CI already
# proved on main -- but the distributions are rebuilt, re-checked and smoked
# from PyPI's own view of the world before anything is published.
#
# Unlike ci.yml, nothing here checks out a sibling repository. The wheel is
# installed with its real dependencies resolved from PyPI, which is exactly
# what a user's `pip install` will do -- and it makes the release order
# self-enforcing: while `agent-host-protocol` is not published, this workflow
# fails at the install step, before anything irreversible.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag names the version the package carries
        # `v0.1.0` pushed against a tree whose __init__ still says 0.1.0.dev0
        # is the classic release-day mistake, and PyPI offers no second try at
        # a version number.
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/agent_host_client/__init__.py').read_text()).group(1))")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but __version__ is ${version}"
            exit 1
          fi

      - run: pip install build twine
      - run: python -m build --outdir dist
      - name: Metadata is valid
        run: twine check --strict dist/*
      - name: The sdist contains only what a source release is
        run: |
          if tar -tzf dist/*.tar.gz | grep -E '\.hypothesis/|_cache/|\.github/|\.venv/'; then
            echo "::error::the sdist contains files that do not belong in a source release"
            exit 1
          fi

      - name: Install the wheel the way a user will
        # Real resolution, real index. `[ws]` because the smoke test imports
        # the transport subpackage, and because this is the install most
        # embedders run.
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install "$(echo dist/*.whl)[ws]"
      - name: Smoke-test it from outside the checkout
        run: cd /tmp && /tmp/fresh/bin/python "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    # The `pypi` environment is where the trusted-publisher trust lives, and
    # where a reviewer requirement can be added without touching this file.
    environment:
      name: pypi
      url: https://pypi.org/p/agent-host-client
    permissions:
      # OIDC trusted publishing; no long-lived token exists anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes are the changelog section, not a rewrite of it
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ { printing = index($0, "[" ver "]") > 0; next }
            printing' CHANGELOG.md > /tmp/notes.md
          if ! [ -s /tmp/notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${version}; the release notes would be empty"
            exit 1
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --verify-tag
