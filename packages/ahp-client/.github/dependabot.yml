# Weekly, grouped, and quiet: one PR per ecosystem rather than one per pin.
# The `agent-host-protocol` dependency is deliberately NOT managed here -- its
# `~=0.1.0` pin is a protocol-version statement, not a freshness concern, and
# the non-blocking `protocol-main` CI job is what watches its drift.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dev:
        patterns: ["*"]
