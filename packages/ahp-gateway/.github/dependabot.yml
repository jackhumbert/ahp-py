# Weekly, grouped, and quiet: one PR per ecosystem rather than one per pin.
# The sibling dependencies are deliberately NOT managed here -- their
# `~=0.1.0` pins are protocol-version statements, not freshness concerns,
# and the non-blocking `protocol-main` CI job is what watches their drift.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dev:
        patterns: ["*"]
