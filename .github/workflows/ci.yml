name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Every package against every other package at this commit: a change to a
    # shared surface cannot pass here and break a sibling.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-packages --all-extras --all-groups
      # The suites run offline: no model, no credentials, no network.
      - run: scripts/check.sh

  platforms:
    # The Windows filesystem jail is a separate implementation (NT handles, not
    # `openat`), attacked on a real Windows runner: real junctions, real
    # symlinks, and a thread racing to swap a component mid-walk. Everything
    # but the host's POSIX-only terminal backend gates on all three platforms.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-packages --all-extras --all-groups
      - name: Resource jail tests
        if: runner.os == 'Windows'
        # Without this a symlink test that cannot create its symlink skips, and
        # a skipped escape test looks exactly like a passing one.
        env:
          AHP_WINDOWS_JAIL_REQUIRED: "1"
        working-directory: packages/ahp-host
        run: >-
          uv run --no-sync pytest -rs
          tests/unit/test_resource_jail_windows.py
          tests/unit/test_resource_jail_windows_paths.py
          tests/unit/test_resource_jail.py
      - name: Claude host
        working-directory: packages/ahp-host-claude
        run: uv run --no-sync pytest && uv run --no-sync python -m ahp_host_claude --help
      - name: ACP host
        # Windows has its own path here: agents are often npm `.cmd` shims.
        working-directory: packages/ahp-host-acp
        run: uv run --no-sync pytest && uv run --no-sync python -m ahp_host_acp --help
      - name: Protocol, client and gateway
        run: |
          for package in ahp-protocol ahp-client ahp-gateway; do
            (cd "packages/$package" && uv run --no-sync pytest)
          done
      - name: Host, whole suite (informational)
        # The rest of the host has never been run on Windows (the pty backend,
        # for one, is POSIX by construction). Reported, not gating.
        continue-on-error: true
        working-directory: packages/ahp-host
        run: uv run --no-sync pytest

  interop:
    # Independently built peers against each other: the published Microsoft
    # TypeScript client against our host over a socket, and our Python client
    # against our host. `AHP_INTEROP_REQUIRED` turns a missing peer into a hard
    # error, because a skipped interop suite looks exactly like a passing one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv sync --locked --all-packages --all-extras --all-groups
      - run: npm i --no-save @microsoft/agent-host-protocol@0.9.0 ws
        working-directory: packages/ahp-host
      - name: Host against both clients
        env:
          AHP_INTEROP_REQUIRED: "1"
        working-directory: packages/ahp-host
        run: uv run --no-sync pytest -m interop
      - name: Client against the host
        env:
          AHP_INTEROP_REQUIRED: "1"
        working-directory: packages/ahp-client
        run: uv run --no-sync pytest

  codegen:
    # The generated tables derive from the vendored upstream TypeScript; a
    # stale checked-in copy would silently diverge from the pin.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-packages --all-extras --all-groups
      - working-directory: packages/ahp-protocol
        run: uv run --no-sync python scripts/generate_tables.py
      - name: Fail if _generated.py is stale
        run: git diff --exit-code -- packages/ahp-protocol/src/ahp_protocol/types/_generated.py

  wheels:
    # Built wheels, installed into a clean venv the way a user would, and
    # imported from outside the checkout: the only way to catch package data
    # that resolves in a source tree and is missing from the distribution.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build --all-packages --out-dir dist
      - name: Install every wheel into a clean venv
        run: |
          uv venv /tmp/fresh
          uv pip install --python /tmp/fresh dist/*.whl websockets
      - name: Smoke-test from outside the checkout
        run: |
          cd /tmp
          for package in ahp-protocol ahp-host ahp-client; do
            /tmp/fresh/bin/python "$GITHUB_WORKSPACE/packages/$package/scripts/smoke_wheel.py"
          done
          /tmp/fresh/bin/python -c "import ahp_gateway, ahp_host_claude, ahp_host_acp"
