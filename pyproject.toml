# Workspace root only: nothing is built from here. Each package under
# `packages/` is its own distribution with its own pyproject.toml.
[tool.uv.workspace]
members = ["packages/*"]

# Sibling dependencies resolve to the workspace, never an index.
[tool.uv.sources]
ahp-protocol = { workspace = true }
ahp-host = { workspace = true }
ahp-client = { workspace = true }
